# Site
name: "설산의 산악도서"
title: "설산의 산악도서"
description: "산악도서를 소개하는 공간입니다."
logo: 'assets/images/logo3.png'
favicon: 'assets/images/logo3.png'
baseurl: ""
url: https://yunbook.mt8848.kr
google_analytics: 'G-KFVVEDDKRB'
disqus: ''
# Utterances (GitHub Issues 기반 댓글). repo 에 utterances 앱 설치 필요: https://github.com/apps/utterances
utterances:
  repo: "sansonyeo/yunBook"
  issue-term: "pathname"
  label: "comment"
  theme: "github-light"
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  sansonyeo:
    name: 설산
    display_name: 설산
    avatar: 'assets/images/avatar.png'
    gravatar: b1cc14991db7a456fcd761680bbc8f81
    email: dream@fun-coding.org 
    web: http://mt8848.kr/
    twitter: 
    description: "산악문학을 좋아하는 모든 분들에게 행복을 드리는 공간이고 싶습니다. "


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 12 
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
