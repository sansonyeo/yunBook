{% if site.utterances and site.utterances.repo %}
<script src="https://utteranc.es/client.js"
        repo="{{ site.utterances.repo }}"
        issue-term="{{ site.utterances.issue-term | default: 'pathname' }}"
        {% if site.utterances.label %}label="{{ site.utterances.label }}"{% endif %}
        theme="{{ site.utterances.theme | default: 'github-light' }}"
        crossorigin="anonymous"
        async>
</script>
{% endif %}
